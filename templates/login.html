<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | KiranaPro Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(1000px 500px at 20% -10%, rgba(16, 185, 129, .18), transparent 60%),
                        radial-gradient(900px 500px at 90% 110%, rgba(99, 102, 241, .16), transparent 60%),
                        #0b1226;
        }
        .login-card { box-shadow: 0 25px 60px -15px rgba(0, 0, 0, .6), 0 0 0 1px rgba(148, 163, 184, .08); animation: card-in .4s ease both; }
        @keyframes card-in { from { opacity: 0; transform: translateY(12px) scale(.99); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen text-slate-100 p-4">
    <div class="login-card bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold">🏪 Kirana<span class="text-sky-400">Pro</span></h1>
            <p class="text-slate-400 text-sm mt-2">Enterprise Store Management</p>
        </div>
        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Username</label>
                <input type="text" name="username" required autocomplete="username" placeholder="admin" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg outline-none focus:ring-2 focus:ring-sky-500 transition">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Password</label>
                <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg outline-none focus:ring-2 focus:ring-sky-500 transition">
            </div>
            <button type="submit" id="login-btn" class="w-full bg-sky-600 hover:bg-sky-700 disabled:opacity-50 text-white py-3 rounded-lg font-bold transition shadow-lg">Enter Dashboard</button>
            <div id="login-error" class="hidden text-red-400 text-sm text-center font-medium"></div>
        </form>
        <p class="text-center text-xs text-slate-500 mt-6">Demo: <b class="text-slate-300">admin / admin123</b> · staff / staff123<br>Fresh standalone installs create these automatically.</p>
        <div class="mt-6 pt-4 border-t border-slate-700 text-center text-[11px] text-slate-500 leading-relaxed">
            <p class="font-mono text-slate-400">{{ app_name }} v{{ app_version }} · {{ app_license }}</p>
            <p>Developed by {{ app_developer }} · {{ app_location }}</p>
            <p><a href="mailto:{{ app_contact }}" class="text-sky-400 hover:underline">{{ app_contact }}</a></p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('login-error');
            btn.disabled = true; btn.innerText = 'Signing in...'; err.classList.add('hidden');
            try {
                const formData = new FormData(e.target);
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.fromEntries(formData))
                });
                const result = await res.json();
                if (res.ok) window.location.href = '/';
                else { err.innerText = result.error || 'Login failed'; err.classList.remove('hidden'); }
            } catch {
                err.innerText = 'Server unreachable. Is Flask running?';
                err.classList.remove('hidden');
            } finally { btn.disabled = false; btn.innerText = 'Enter Dashboard'; }
        };
    </script>
</body>
</html>
