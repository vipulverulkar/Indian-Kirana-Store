name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test Code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Validate syntax and imports
        run: |
          python -m py_compile app.py desktop.py seed.py kirana/*.py
          python -c "from kirana import create_app; app = create_app(); print('App verification passed')"

  test-docker-build:
    name: Test Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: kiranapro-test:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker container startup
        run: |
          docker run --rm -d --name kiranapro-test -e DB_BACKEND=sqlite -p 5000:5000 kiranapro-test:local
          sleep 5
          docker logs kiranapro-test
          docker stop kiranapro-test
